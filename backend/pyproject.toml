[project]
name = "tradevalue-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.2", "SQLAlchemy==2.0.23", "psycopg2-binary==2.9.9",
  "python-dotenv==1.0.0", "fastapi==0.141.1", "uvicorn==0.49.0", "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
exclude = ["src/app/ScriptingFiles/**", "**/__pycache__/**", "src/app/**/tests/**"]

[tool.hatch.build.targets.sdist]
include = ["src/app", "pyproject.toml"]
exclude = ["src/app/ScriptingFiles/**", "**/__pycache__/**", "src/app/**/tests/**"]
