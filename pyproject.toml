[project]
name = "tradevalue"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["tradevalue-backend"]

[dependency-groups]
migration = ["httpx==0.28.1"]
ingestion = ["pandas==2.3.3", "requests==2.31.0"]
ml = ["tradevalue-ml"]
dev = ["httpx==0.28.1", "pytest==8.4.2", "pytest-cov==7.0.0", "hypothesis==6.156.4", "ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false
constraint-dependencies = [
  "alembic==1.19.2",
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "click==8.5.0",
  "colorama==0.4.6 ; sys_platform == 'win32'",
  "coverage==7.16.0",
  "fastapi==0.141.1",
  "greenlet==3.5.5 ; platform_machine == 'AMD64' or platform_machine == 'WIN32' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'ppc64le' or platform_machine == 'win32' or platform_machine == 'x86_64'",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.19",
  "iniconfig==2.3.0",
  "joblib==1.5.1",
  "mako==1.4.1",
  "markupsafe==3.0.3",
  "numpy==2.4.4",
  "packaging==26.3",
  "pandas==2.3.3",
  "pluggy==1.6.0",
  "psycopg2-binary==2.9.9",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  "pygments==2.21.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.0.0",
  "pytz==2026.3.post1",
  "requests==2.31.0",
  "scikit-learn==1.8.0",
  "scipy==1.18.1",
  "six==1.17.0",
  "sqlalchemy==2.0.23",
  "starlette==1.6.0",
  "threadpoolctl==3.6.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "tzdata==2026.3",
  "urllib3==2.7.0",
  "uvicorn==0.49.0",
]
default-groups = ["dev", "ingestion", "ml"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
addopts = "--cov=app --cov=ml --cov-branch --cov-report=term-missing --cov-report=html:coverage/python/html --cov-report=xml:coverage/python/coverage.xml --cov-report=lcov:coverage/python/lcov.info --cov-fail-under=58.80"
testpaths = ["tests/backend", "tests/ml"]

[tool.coverage.run]
omit = ["*/api/tests/*", "*/roster_status/tests/*", "*/source_ingestion/tests/*"]
branch = true
relative_files = true
source = ["app", "ml"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true

[tool.uv.workspace]
members = ["backend", "ml"]

[tool.uv.sources]
tradevalue-backend = { workspace = true }
tradevalue-ml = { workspace = true }
