name: Database migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the direct Neon DATABASE_URL
        required: true
        type: choice
        options:
          - nonprod
          - prod

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }} database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment branch and direct connection
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            test "$GITHUB_REF_NAME" = "Prod" || {
              echo "Select Prod when migrating prod."
              exit 1
            }
          elif [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Select the current x.y.z release branch when migrating nonprod."
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler*)
              echo "DATABASE_URL must be a direct, non-pooled migration connection."
              exit 1
              ;;
          esac
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            constraints.txt
            backend/constraints.txt
            backend/requirements.txt
      - name: Install migration dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate linear migration history
        run: python backend/database/verify_migrations.py
      - name: Check database migration preconditions
        run: python backend/database/migration_preflight.py
      - name: Record current revision
        run: python -m alembic -c backend/alembic.ini current
      - name: Apply migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Verify migrated schema
        run: python backend/database/schema_snapshot.py
      - name: Smoke-test migrated API
        run: PYTHONPATH=backend python backend/database/migration_smoke.py
      - name: Write migration summary
        if: ${{ always() }}
        run: |
          {
            echo "## Database migration"
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Revision after run: $(python -m alembic -c backend/alembic.ini current 2>&1)"
          } >> "$GITHUB_STEP_SUMMARY"
