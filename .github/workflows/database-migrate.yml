name: Database migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the direct Neon DATABASE_URL
        required: true
        type: choice
        options:
          - nonprod
          - prod

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }} database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment branch and direct connection
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            test "$GITHUB_REF_NAME" = "Prod" || {
              echo "Select Prod when migrating prod."
              exit 1
            }
          elif [[ ! "$GITHUB_REF_NAME" =~ ^(Release|Hotfix)-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select a Release-x.y.z or Hotfix-x.y.z branch when migrating nonprod."
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler*)
              echo "DATABASE_URL must be a direct, non-pooled migration connection."
              exit 1
              ;;
          esac
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install migration dependencies
        run: uv sync --locked --no-default-groups --group migration
      - name: Validate linear migration history
        run: uv run --no-default-groups --group migration python backend/database/verify_migrations.py
      - name: Check database migration preconditions
        run: uv run --no-default-groups --group migration python backend/database/migration_preflight.py
      - name: Record current revision
        run: uv run --no-default-groups --group migration python -m alembic -c backend/alembic.ini current
      - name: Apply migrations
        run: uv run --no-default-groups --group migration python -m alembic -c backend/alembic.ini upgrade head
      - name: Verify migrated schema
        run: uv run --no-default-groups --group migration python backend/database/schema_snapshot.py
      - name: Smoke-test migrated API
        run: uv run --no-default-groups --group migration python backend/database/migration_smoke.py
      - name: Write migration summary
        if: ${{ always() }}
        run: |
          {
            echo "## Database migration"
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Revision after run: $(uv run --no-default-groups --group migration python -m alembic -c backend/alembic.ini current 2>&1)"
          } >> "$GITHUB_STEP_SUMMARY"
