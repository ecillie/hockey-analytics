name: Dev

on:
  pull_request:
    branches: [Dev]
  push:
    branches: [Dev]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_reusable-ci.yml

  required:
    name: Dev required
    if: ${{ always() }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = "success"

  merge-to-dev:
    name: Enable automatic squash merge to Dev
    if: ${{ github.event_name == 'pull_request' && needs.required.result == 'success' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge for the validated pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash

  promote:
    name: Promote Dev to the latest release
    if: ${{ github.event_name == 'push' && needs.required.result == 'success' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: environment-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Find the latest release branch
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_BRANCH=$(gh api --paginate \
            "repos/${{ github.repository }}/branches?per_page=100" \
            --jq '.[].name' | python3 .github/scripts/latest_release_branch.py)
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Promoting Dev to $RELEASE_BRANCH."
      - name: Create or find promotion pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          PR_TITLE="release: promote Dev → $RELEASE_BRANCH"
          PR_BODY="Automated promotion from \`Dev\` to \`$RELEASE_BRANCH\`. This PR merges after all release requirements pass."
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "$RELEASE_BRANCH" \
            --head "Dev" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base "$RELEASE_BRANCH" \
              --head "Dev" \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
            PR_NUMBER=${PR_URL##*/}
          else
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi

          echo "Promotion PR #$PR_NUMBER will be validated and merged by the Release workflow."
