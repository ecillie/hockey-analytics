name: Dev

on:
  pull_request:
    branches: [Dev]
  push:
    branches: [Dev]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_reusable-ci.yml

  required:
    name: Dev required
    if: ${{ always() }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = "success"

  merge-to-dev:
    name: Enable automatic merge to Dev
    if: ${{ github.event_name == 'pull_request' && needs.required.result == 'success' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge for the validated pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --merge

  promote:
    name: Promote Dev to current release
    if: ${{ github.event_name == 'push' && needs.required.result == 'success' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: environment-promotion
      cancel-in-progress: false
    steps:
      - name: Create or find promotion pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_BRANCH=$(gh api "repos/${{ github.repository }}/branches" --paginate \
            --jq '.[].name' | awk '/^Release-[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -1)
          test -n "$RELEASE_BRANCH" || { echo "Create a Release-x.y.z branch first."; exit 1; }

          AHEAD=$(gh api "repos/${{ github.repository }}/compare/$RELEASE_BRANCH...Dev" --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "Dev has no commits to promote to $RELEASE_BRANCH."
            exit 0
          fi

          if [ -z "$(gh pr list --repo "${{ github.repository }}" \
            --base "$RELEASE_BRANCH" --head Dev --state open \
            --json number --jq '.[0].number')" ]; then
            gh pr create --repo "${{ github.repository }}" \
              --base "$RELEASE_BRANCH" --head Dev \
              --title "Promote Dev to $RELEASE_BRANCH" \
              --body "Automated promotion from Dev to $RELEASE_BRANCH. This PR merges after all release branch requirements pass."
          fi
