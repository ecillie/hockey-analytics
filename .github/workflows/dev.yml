name: Dev

on:
  pull_request:
    branches: [Dev]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [Dev]
  workflow_dispatch:
    inputs:
      release_type:
        description: Destination type for this Dev promotion (includes all pending Dev changes)
        required: true
        default: release
        type: choice
        options:
          - release
          - hotfix

concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_reusable-ci.yml

  required:
    name: Dev required
    if: ${{ always() }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = "success"

  merge-to-dev:
    name: Enable automatic merge to Dev
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.required.result == 'success' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge for the validated pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          is_draft=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
          if [ "$is_draft" != false ]; then
            echo "PR is currently a draft; skipping auto-merge."
            exit 0
          fi
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --merge

  promote:
    name: Promote Dev to selected release type
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.required.result == 'success' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: environment-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create or find promotion pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          PROMOTION_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || vars.DEV_PROMOTION_TYPE || 'release' }}
        run: bash scripts/promote-dev.sh
