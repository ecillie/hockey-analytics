name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Select CI areas
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.select.outputs.ml }}
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      selective: ${{ steps.select.outputs.selective }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PR routing and Dev promotion
        run: |
          bash scripts/test-pr-routing.sh
          bash scripts/test-dev-promotion.sh
      - name: Select affected areas
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request || "${GITHUB_BASE_REF:-}" == Prod ]]; then
            for area in ml backend frontend; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
            echo "selective=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          shared=false
          if grep -Eq '^(\.github/workflows/|docs/openapi\.json$|\.python-version$|\.nvmrc$|constraints\.txt$|pyproject\.toml$|uv\.lock$|scripts/|tests/)' <<< "$files"; then
            shared=true
          fi
          for area in ml backend frontend; do
            selected=$shared
            if grep -q "^$area/" <<< "$files"; then selected=true; fi
            if [[ "$area" == ml ]] && grep -qx 'backend/requirements-dev.txt' <<< "$files"; then selected=true; fi
            echo "$area=$selected" >> "$GITHUB_OUTPUT"
          done

          # Feature PRs into Dev run only the tests their changes affect. Inputs
          # that dependency tracking cannot see force the full suite: tooling and
          # dependencies, migrations, fixtures and conftest files, data and other
          # non-Python files, and frontend files outside src/ or in src/test/.
          selective=false
          if [[ "$GITHUB_BASE_REF" == Dev ]]; then
            selective=true
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*|scripts/*|.python-version|.nvmrc|constraints.txt|pyproject.toml|uv.lock) selective=false ;;
                conftest.py|*/conftest.py|*/fixtures/*|backend/migrations/*|backend/database/migrations/*) selective=false ;;
                backend/*.py|ml/*.py|tests/*.py) ;;
                backend/*|ml/*|tests/*) selective=false ;;
                frontend/src/test/*) selective=false ;;
                frontend/src/*) ;;
                frontend/*) selective=false ;;
              esac
            done <<< "$files"
          fi
          echo "selective=$selective" >> "$GITHUB_OUTPUT"

  ml-gate:
    name: ML correctness and evaluation gate
    needs: [changes]
    if: ${{ needs.changes.outputs.ml == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install ML dependencies
        run: uv sync --locked --all-groups
      - name: Run ML correctness tests
        run: uv run pytest --no-cov -q tests/ml
      - name: Enforce metric regression thresholds
        run: uv run python -m ml.evaluation.gate

  backend:
    name: Backend tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradevalue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradevalue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      PGPASSWORD: postgres
      SELECTIVE: ${{ needs.changes.outputs.selective }}
      TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --locked --all-groups
      # Without a baseline, testmon treats every test as affected.
      - name: Restore test-impact baseline
        if: ${{ needs.changes.outputs.selective == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .testmondata
          key: testmon-${{ github.event.pull_request.base.sha }}
          restore-keys: testmon-
      - name: Check Python lint, formatting, and types
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
      - name: Verify Python structural rules
        run: uv run python -m backend.database.verify_python_rules
      - name: Verify dependency exports
        run: bash scripts/export-requirements.sh --check
      - name: Verify isolated wheel installations
        run: bash scripts/verify-packages.sh
      - name: Validate committed OpenAPI contract
        run: uv run python backend/export_openapi.py --check
      - name: Compile and import supported backend entrypoints
        run: uv run pytest --no-cov -q tests/backend/test_supported_entrypoints.py
      - name: Validate linear migration history
        run: uv run python backend/database/verify_migrations.py
      - name: Generate reviewable migration SQL
        run: |
          mkdir -p coverage/migrations
          uv run python -m alembic -c backend/alembic.ini upgrade head --sql > coverage/migrations/upgrade.sql
      - name: Check database migration preconditions
        run: uv run python backend/database/migration_preflight.py
      - name: Upgrade empty database to head
        run: uv run python -m alembic -c backend/alembic.ini upgrade head
      - name: Verify migrated schema snapshot
        run: uv run python backend/database/schema_snapshot.py --actual coverage/migrations/schema.actual.json
      - name: Verify repeated upgrade is a no-op
        run: |
          uv run python -m alembic -c backend/alembic.ini upgrade head
          uv run python -m alembic -c backend/alembic.ini current --check-heads
      - name: Verify downgrade and re-upgrade round trip
        run: |
          uv run python -m alembic -c backend/alembic.ini downgrade base
          uv run python -m alembic -c backend/alembic.ini upgrade head
          uv run python backend/database/schema_snapshot.py --actual coverage/migrations/schema.round-trip.json
      - name: Smoke-test migrated API
        run: uv run python backend/database/migration_smoke.py
      - name: Run deterministic ingestion and data-quality gate
        run: uv run pytest --no-cov -q tests/backend/test_ingestion.py
      - name: Run isolated Python unit tests
        run: |
          testmon=()
          if [ "$SELECTIVE" = true ]; then testmon=(--testmon-forceselect --testmon-nocollect); fi
          env -u DATABASE_URL -u DEV_DATABASE_URL -u TEST_DATABASE_URL ENV='' TRADEVALUE_ENV_FILE=/dev/null uv run pytest --no-cov -m unit -q "${testmon[@]}"
      - name: Run backend and ML tests with coverage
        if: ${{ needs.changes.outputs.selective != 'true' }}
        run: uv run pytest -q
      - name: Run affected backend and ML tests
        if: ${{ needs.changes.outputs.selective == 'true' }}
        run: uv run pytest --no-cov -q --testmon-nocollect
      - name: Enforce complete service-layer coverage
        if: ${{ needs.changes.outputs.selective != 'true' }}
        run: uv run python -m coverage report --include='backend/src/app/api/service.py,backend/src/app/api/repository.py,backend/src/app/api/policy.py,backend/src/app/api/util.py,backend/src/app/api/errors.py,backend/src/app/shared/calendar.py' --fail-under=100
      - name: Build backend container artifact
        run: docker build --tag "tradevalue-api:${{ github.sha }}" backend
      - name: Build and check ingestion container artifact
        run: |
          docker build --file backend/ingestion.Dockerfile --tag "tradevalue-ingestion:${{ github.sha }}" backend
          for command in fetch_data run_all; do
            docker run --rm "tradevalue-ingestion:${{ github.sha }}" \
              python -m "app.ScriptingFiles.FullDataScript.$command" --help > /dev/null
          done
      - name: Start and smoke-test backend container artifact
        env:
          IMAGE_NAME: tradevalue-api:${{ github.sha }}
          CONTAINER_NAME: tradevalue-api-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker logs "$CONTAINER_NAME" || true
            fi
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --add-host host.docker.internal:host-gateway \
            --publish 8000:8000 \
            --env ENV=dev \
            --env DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/tradevalue_test \
            --env CORS_ORIGINS=http://localhost:5173 \
            "$IMAGE_NAME"
          uv run python backend/database/container_smoke.py
      - name: Upload Python coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage/python
          if-no-files-found: warn
          retention-days: 14
      - name: Upload migration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics
          path: coverage/migrations
          if-no-files-found: warn
          retention-days: 14

  # Records which code each Python test runs, so feature PRs into Dev can run
  # only affected tests. It is an optimization and never blocks promotion.
  # testmon cannot run with branch coverage, so this is a separate run.
  test-impact-baseline:
    name: Test-impact baseline
    needs: [changes]
    if: ${{ github.event_name == 'push' && github.ref_name == 'Dev' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradevalue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradevalue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      PGPASSWORD: postgres
      TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --locked --all-groups
      - name: Upgrade empty database to head
        run: uv run python -m alembic -c backend/alembic.ini upgrade head
      - name: Record test impact
        run: uv run pytest --no-cov -q --testmon
      - name: Save test-impact baseline
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .testmondata
          key: testmon-${{ github.sha }}

  frontend:
    name: Frontend tests and build
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate generated API types
        run: npm run api:contract
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests with coverage
        if: ${{ needs.changes.outputs.selective != 'true' }}
        run: npm run test:coverage
      - name: Run affected frontend tests
        if: ${{ needs.changes.outputs.selective == 'true' }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          npx vitest run --changed "origin/$GITHUB_BASE_REF" --passWithNoTests
      - name: Upload frontend coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Build frontend
        run: npm run build
