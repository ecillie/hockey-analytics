name: Replacement data job
description: Shared setup and bounded execution of approved Python data entrypoints
inputs:
  job:
    description: Named job or refill
    required: true
  environment:
    description: Explicit target environment
    required: true
  target-id:
    description: Prepared database UUID
    required: true
  database-url:
    description: Environment-scoped direct PostgreSQL connection
    required: true
  current-season:
    description: Current NHL start year, or source-resolved
  first-season:
    description: First year, or job default
  last-season:
    description: Last year, or current season
  validation-only:
    description: Validate without writes
    default: 'true'
  resume:
    description: Resume committed refill checkpoints
    default: 'false'
  jobs:
    description: Selected refill jobs, or all supported sources
  max-partitions:
    description: New partitions per manual dispatch
    default: '8'
  enabled:
    description: Independent job enabled state, or reviewed job default
  lookback-days:
    description: Independent correction window, or reviewed job default
  max-input-age-seconds:
    description: Independent freshness threshold, or reviewed job default
  max-batches:
    description: Maximum batches in one partition
    default: '10000'
  dataset-config:
    description: Audited JSON file in approved checkout
  coverage-config:
    description: Independent population audit file in approved checkout
  artifact-root:
    description: Retained mounted dataset artifact directory
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: |
          backend/requirements-dev.txt
          backend/requirements.txt
          backend/constraints.txt
          constraints.txt
          ml/requirements.txt
    - name: Install data runtime dependencies
      shell: bash
      run: python -m pip install -r backend/requirements-dev.txt
    - name: Execute bounded job and retain durable progress
      shell: bash
      env:
        ENV: ${{ inputs.environment }}
        DATABASE_URL: ${{ inputs.database-url }}
        PYTHONPATH: backend
        DATA_JOB: ${{ inputs.job }}
        DATA_ENVIRONMENT: ${{ inputs.environment }}
        DATA_TARGET_ID: ${{ inputs.target-id }}
        DATA_CURRENT_SEASON: ${{ inputs.current-season }}
        DATA_FIRST_SEASON: ${{ inputs.first-season }}
        DATA_LAST_SEASON: ${{ inputs.last-season }}
        DATA_VALIDATION_ONLY: ${{ inputs.validation-only }}
        DATA_RESUME: ${{ inputs.resume }}
        DATA_JOBS: ${{ inputs.jobs }}
        DATA_MAX_PARTITIONS: ${{ inputs.max-partitions }}
        DATA_ENABLED: ${{ inputs.enabled }}
        DATA_LOOKBACK_DAYS: ${{ inputs.lookback-days }}
        DATA_MAX_INPUT_AGE_SECONDS: ${{ inputs.max-input-age-seconds }}
        DATA_MAX_BATCHES: ${{ inputs.max-batches }}
        DATA_DATASET_CONFIG: ${{ inputs.dataset-config }}
        DATA_COVERAGE_CONFIG: ${{ inputs.coverage-config }}
        DATA_ARTIFACT_ROOT: ${{ inputs.artifact-root }}
        BACKEND_LOG_FILE: ''
      run: |
        set -euo pipefail
        timeout --signal=INT --kill-after=60s 300m python -m app.jobs.workflow
