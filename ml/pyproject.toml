[project]
name = "tradevalue-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tradevalue-backend==0.1.0",
    "numpy==2.4.4",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "joblib==1.5.1",
    "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
tradevalue-backend = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
exclude = ["**/__pycache__/**", "**/outputs/**"]

[tool.hatch.build.targets.sdist]
include = ["src/ml", "pyproject.toml"]
exclude = ["**/__pycache__/**", "**/outputs/**"]
